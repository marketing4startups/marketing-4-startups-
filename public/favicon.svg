<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141C2E" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>

    <!-- Warm Gold Gradient for "4" & Trajectory -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C28B52" />
      <stop offset="50%" stop-color="#E0A96D" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C28B52" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#E0A96D" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Monogram: Modern Architectural "M" (in Crisp White) -->
  <path 
    d="M14 44 V20 L24 33 L34 20 V44" 
    fill="none" 
    stroke="#F8FAFC" 
    stroke-width="4.5" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- Bold Accent "4" with Upward Arrow Head (in Warm Amber Gold) -->
  <!-- Vertical stem of 4 -->
  <path 
    d="M45 16 V46" 
    stroke="url(#goldGrad)" 
    stroke-width="4.5" 
    stroke-linecap="round" 
  />
  
  <!-- Crossbar & diagonal of 4 -->
  <path 
    d="M45 34 H36 L43 20" 
    fill="none" 
    stroke="url(#goldGrad)" 
    stroke-width="4" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- Emerald Trust / Safe Dot (Irish Tech Indicator) -->
  <circle cx="50" cy="18" r="3" fill="#10B981" />
</svg>
