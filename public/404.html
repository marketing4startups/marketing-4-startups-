<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Marketing4Startups | Redirecting...</title>
    <script>
      // Single Page Application redirect script for GitHub Pages
      // Stores requested path and query in sessionStorage and redirects to root
      var segmentCount = 1;
      var location = window.location;
      location.replace(
        location.protocol +
          '//' +
          location.hostname +
          (location.port ? ':' + location.port : '') +
          location.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?p=/' +
          location.pathname
            .slice(1)
            .split('/')
            .slice(segmentCount)
            .join('/')
            .replace(/&/g, '~and~') +
          (location.search
            ? '&q=' + location.search.slice(1).replace(/&/g, '~and~')
            : '') +
          location.hash
      );
    </script>
  </head>
  <body style="background-color: #0B0F17; color: #F8FAFC; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to Marketing4Startups...</p>
  </body>
</html>
